<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Demonlist Clone</title>
    <style>
        /* Полностью автономные стили без внешних библиотек */
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0d12;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0 0 3rem 0;
        }
        header {
            background-color: #141822;
            border-bottom: 2px solid #1f2736;
            padding: 1.5rem 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            background: linear-gradient(90deg, #ff4141, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: monospace;
        }
        header p {
            margin: 0.4rem 0 0 0;
            font-size: 0.75rem;
            color: #8492a6;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }
        main {
            max-width: 750px;
            margin: 2rem auto 0 auto;
            padding: 0 1rem;
        }
        #demon-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .demon-card {
            background-color: #141822;
            border: 1px solid #1f2736;
            border-radius: 0.6rem;
            padding: 1.1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.15s ease, border-color 0.15s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .demon-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 65, 65, 0.4);
        }
        .left-side {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        .position {
            font-size: 1.35rem;
            font-weight: 900;
            font-family: monospace;
            width: 45px;
            text-align: center;
            color: #4a5568;
        }
        .top-three {
            color: #ffaa00;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
        }
        .info-block {
            display: flex;
            flex-direction: column;
        }
        .title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.02em;
        }
        .author {
            margin: 0.25rem 0 0 0;
            font-size: 0.8rem;
            color: #8492a6;
        }
        .author span {
            color: #cbd5e1;
            font-weight: 500;
        }
        .right-side {
            display: flex;
            align-items: center;
        }
        .score-badge {
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: #f87171;
            background-color: rgba(220, 38, 38, 0.15);
            padding: 0.35rem 0.75rem;
            border-radius: 0.35rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>GLOBAL DEMONLIST</h1>
        <p>Топ актуальных сложнейших демонов</p>
    </header>

    <main>
        <div id="demon-list"></div>
    </main>

    <script>
        // Полностью автономная локальная база данных топ-уровней Demonlist
        const DEMONS_DATA = [
            { position: 1, name: "Society", publisher: "Neomarbilan", score: 100.00 },
            { position: 2, name: "Thinking Space II", publisher: "CairoX", score: 95.50 },
            { position: 3, name: "Flamewall", publisher: "Narwall", score: 91.20 },
            { position: 4, name: "Amethyst", publisher: "iMist", score: 87.10 },
            { position: 5, name: "Tidal Wave", publisher: "OniLink", score: 83.40 },
            { position: 6, name: "ORBIT", publisher: "MindCap", score: 80.00 },
            { position: 7, name: "Nullscapes", publisher: "Kiba", score: 76.85 },
            { position: 8, name: "Quanteuse", publisher: "Renn241", score: 74.00 },
            { position: 9, name: "BOOBAWAMBA", publisher: "Akunakunn", score: 71.30 },
            { position: 10, name: "Every End", publisher: "MindCap", score: 68.90 },
            { position: 11, name: "Penumbral", publisher: "cherryteam", score: 66.40 },
            { position: 12, name: "Silent Clubstep", publisher: "TheRealSailent", score: 64.10 },
            { position: 13, name: "Ashley Wave Trials", publisher: "oddmod", score: 62.00 },
            { position: 14, name: "Acheron", publisher: "Riot", score: 60.15 },
            { position: 15, name: "Avernus", publisher: "Porsalin", score: 58.40 },
            { position: 16, name: "Kyouki", publisher: "ViperElite", score: 56.80 },
            { position: 17, name: "Slaughterhouse", publisher: "IcedCave", score: 55.20 },
            { position: 18, name: "Sakupen Circles", publisher: "TrusTa", score: 53.70 },
            { position: 19, name: "Firework", publisher: "Trick", score: 52.30 },
            { position: 20, name: "Zodiac", publisher: "Bianox", score: 51.00 }
        ];

        function renderInterface() {
            const container = document.getElementById('demon-list');
            container.innerHTML = ''; 

            DEMONS_DATA.forEach(item => {
                const card = document.createElement('div');
                card.className = "demon-card";

                const isPremiumRank = item.position <= 3;
                const formattedScore = item.score.toFixed(2);

                card.innerHTML = `
                    <div class="left-side">
                        <span class="position ${isPremiumRank ? 'top-three' : ''}">#${item.position}</span>
                        <div class="info-block">
                            <h2 class="title">${item.name}</h2>
                            <p class="author">Создатель: <span>${item.publisher}</span></p>
                        </div>
                    </div>
                    <div class="right-side">
                        <span class="score-badge">${formattedScore} ★</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.addEventListener('DOMContentLoaded', renderInterface);
    </script>
</body>
</html>
