<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Demonlist Clone</title>
    <style>
        /* Общие и базовые стили темной темы */
        * {
            box-sizing: border-box;
        }
        body {
            background-color: #0b0d12;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0 0 3rem 0;
        }
        
        /* Шапка страницы */
        header {
            background-color: #141822;
            border-bottom: 2px solid #1f2736;
            padding: 1.5rem 1rem;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }
        h1 {
            margin: 0;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            background: linear-gradient(90deg, #ff4141, #ffaa00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-family: monospace;
        }
        header p {
            margin: 0.4rem 0 0 0;
            font-size: 0.75rem;
            color: #8492a6;
            text-transform: uppercase;
            letter-spacing: 0.2em;
        }

        /* Контейнер */
        main {
            max-width: 750px;
            margin: 2rem auto 0 auto;
            padding: 0 1rem;
        }

        /* Элементы состояния */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6rem 0;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid #1f2736;
            border-top: 4px solid #ff4141;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.2rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            color: #8492a6;
            font-size: 0.95rem;
            font-weight: 500;
        }
        
        #error-message {
            display: none;
            background-color: rgba(220, 38, 38, 0.1);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 1.25rem;
            border-radius: 0.5rem;
            text-align: center;
            line-height: 1.5;
        }

        /* Список и карточки */
        #demon-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }
        .demon-card {
            background-color: #141822;
            border: 1px solid #1f2736;
            border-radius: 0.6rem;
            padding: 1.1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.15s ease, border-color 0.15s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .demon-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 65, 65, 0.4);
        }
        .left-side {
            display: flex;
            align-items: center;
            gap: 1.2rem;
        }
        .position {
            font-size: 1.35rem;
            font-weight: 900;
            font-family: monospace;
            width: 45px;
            text-align: center;
            color: #4a5568;
        }
        .top-three {
            color: #ffaa00;
            font-size: 1.6rem;
            text-shadow: 0 0 10px rgba(255, 170, 0, 0.2);
        }
        .info-block {
            display: flex;
            flex-direction: column;
        }
        .title {
            margin: 0;
            font-size: 1.15rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.02em;
        }
        .author {
            margin: 0.25rem 0 0 0;
            font-size: 0.8rem;
            color: #8492a6;
        }
        .author span {
            color: #cbd5e1;
            font-weight: 500;
        }
        .right-side {
            display: flex;
            align-items: center;
        }
        .score-badge {
            font-family: monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: #f87171;
            background-color: rgba(220, 38, 38, 0.15);
            padding: 0.35rem 0.75rem;
            border-radius: 0.35rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
    </style>
</head>
<body>

    <header>
        <h1>GLOBAL DEMONLIST</h1>
        <p>Топ 50 сложнейших демонов</p>
    </header>

    <main>
        <!-- Индикатор выполнения операции -->
        <div id="loader">
            <div class="spinner"></div>
            <div class="loading-text">Загрузка актуального списка демонов...</div>
        </div>

        <!-- Окно системной ошибки -->
        <div id="error-message">
            <strong>Ошибка соединения!</strong><br>
            Не удалось получить данные с серверов Demonlist API через прокси-серверы.<br>
            Пожалуйста, обновите страницу или попробуйте зайти позже.
        </div>

        <!-- Контейнер вывода данных -->
        <div id="demon-list"></div>
    </main>

    <script>
        const TARGET_API = "https://demonlist.org";
        
        // Список доступных публичных CORS-прокси на случай отказа одного из них
        const PROXIES = [
            "https://corsproxy.io/?url=",
            "https://proxy.killcors.com/?url="
        ];

        async function loadDemonListData() {
            const loaderElement = document.getElementById('loader');
            const errorElement = document.getElementById('error-message');
            const listContainer = document.getElementById('demon-list');

            // Поочередный перебор прокси-серверов в случае падения
            for (let i = 0; i < PROXIES.length; i++) {
                try {
                    const proxyUrl = PROXIES[i] + encodeURIComponent(TARGET_API);
                    const response = await fetch(proxyUrl);
                    
                    if (!response.ok) throw new Error(`Провалено использование прокси #${i}`);

                    const data = await response.json();
                    
                    // Успешное выполнение: скрываем загрузчик и строим интерфейс
                    loaderElement.style.display = 'none';
                    buildInterface(data, listContainer);
                    return; // Прерываем функцию, так как данные получены

                } catch (err) {
                    console.warn(`Прокси-сервер ${i + 1} вернул ошибку, пробуем следующий...`, err);
                }
            }

            // Если выполнение дошло сюда, значит все прокси вернули ошибку
            loaderElement.style.display = 'none';
            errorElement.style.display = 'block';
        }

        function buildInterface(demons, container) {
            container.innerHTML = ''; // Сброс состояния контента

            demons.forEach(item => {
                const card = document.createElement('div');
                card.className = "demon-card";

                const isPremiumRank = item.position <= 3;
                const formattedScore = Number(item.score).toFixed(2);

                card.innerHTML = `
                    <div class="left-side">
                        <span class="position ${isPremiumRank ? 'top-three' : ''}">#${item.position}</span>
                        <div class="info-block">
                            <h2 class="title">${item.name}</h2>
                            <p class="author">Создатель: <span>${item.publisher ? item.publisher.name : 'Unknown'}</span></p>
                        </div>
                    </div>
                    <div class="right-side">
                        <span class="score-badge">${formattedScore} ★</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Автозапуск при инициализации окна браузера
        window.addEventListener('DOMContentLoaded', loadDemonListData);
    </script>
</body>
</html>
